name: Update contribution animation

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate contribution animations
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/contributions.svg?color_snake=#6ba99b
            assets/contributions-dark.svg?palette=github-dark&color_snake=#82ddc5

      - name: Save generated assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/contributions.svg assets/contributions-dark.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Update contribution animation'
          git push
