<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="146" viewBox="0 0 1000 146" role="img" aria-labelledby="title"><title id="title">One open tab: wallpaper to palette to desktop. Wallpaper-driven themes in a Linux workstation.</title>
<rect x="1" y="1" width="998" height="144" rx="8" fill="#131c28" stroke="#34465a"/>
<text x="23" y="32" font-family="DejaVu Sans Mono,Consolas,monospace" font-size="12" fill="#b5a7ef">ONE OPEN TAB / LINUX WORKSTATIONS</text>
<text x="23" y="80" font-family="DejaVu Sans Mono,Consolas,monospace" font-size="31" fill="#dbe8f4">wallpaper → palette → desktop</text>
<path d="M24 114H970" stroke="#34465a"/>
<circle cx="30" cy="114" r="4" fill="#b5a7ef"><animate attributeName="cx" values="30;969;30" dur="8s" repeatCount="indefinite"/></circle>
</svg>
