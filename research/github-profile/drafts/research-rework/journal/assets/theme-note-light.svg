<rect x="8" y="8" width="158" height="97" rx="3" fill="url(#land)"/>
<path d="M8 96L60 49L103 75L139 38L166 56V105H8Z" fill="#3d6560" opacity=".45"/>
<circle cx="131" cy="32" r="12" fill="#efd7b2"/>
