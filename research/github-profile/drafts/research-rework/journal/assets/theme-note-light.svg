<text x="35" y="39" font-family="DejaVu Sans Mono,Consolas,monospace" font-size="12" fill="#bb572f" letter-spacing="1.5">CURRENTLY ON THE WORKBENCH</text>
<text x="33" y="116" font-family="Georgia,DejaVu Serif,serif" font-size="49" fill="#233f3b">A desktop that</text>
<text x="33" y="175" font-family="Georgia,DejaVu Serif,serif" font-size="49" fill="#233f3b">feels like mine.</text>
<path d="M36 200H384" stroke="#d7d8c9"/>
<text x="36" y="235" font-family="Arial,DejaVu Sans,sans-serif" font-size="19" fill="#66716a">Wallpaper-driven themes,</text>
<text x="36" y="263" font-family="Arial,DejaVu Sans,sans-serif" font-size="19" fill="#66716a">from an image to the desktop.</text>
<g transform="translate(502 66) scale(1)">
