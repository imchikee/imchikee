<svg xmlns="http://www.w3.org/2000/svg" width="520" height="425" viewBox="0 0 520 425" role="img" aria-labelledby="title"><title id="title">Current workbench: wallpaper-driven desktop themes. A wallpaper becomes a palette and desktop colors.</title>
