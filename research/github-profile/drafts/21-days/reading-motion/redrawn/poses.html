<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>阅读动作 · 姿态对照</title><style>*{box-sizing:border-box}body{background:#faf7ef;color:#493a30;font:16px/1.7 system-ui,sans-serif;margin:0}main{max-width:1400px;padding:24px;margin:auto}h1{font-size:24px}.poses{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}figure{margin:0;min-width:0}canvas{display:block;width:100%;height:auto;border-radius:8px}figcaption{padding:10px 0}a{color:inherit}@media(max-width:750px){.poses{grid-template-columns:1fr}}@media(prefers-color-scheme:dark){body{background:#171b20;color:#e9e1d4}}</style><main><h1>原稿、中间姿态、低头姿态</h1><p>本次三张均统一修订左右脸与双耳轮廓；对照帽檐、视线、口鼻、腮帮体积与轮廓毛尖。</p><div class="poses" id="poses"></div><p><a href="../index.html">返回短动作</a> · <a href="contour-check.html">轮廓毛发前后对照</a> · <a href="WHOLE-CONTOUR-PROMPTS.md">生成记录</a></p></main><script src="contour-data.js"></script><script>
const entries=contourPatches.map(p=>{const f=document.createElement('figure'),c=document.createElement('canvas'),caption=document.createElement('figcaption');c.width=820;c.height=520;c.setAttribute('role','img');c.setAttribute('aria-label',p.name);caption.textContent=p.name;f.append(c,caption);document.getElementById('poses').append(f);return {p,c,images:[p.base,p.patch,p.headPatch].map(src=>{const i=new Image();i.src='../'+src;return i;})};});window.contourReady=Promise.all(entries.flatMap(e=>e.images).map(i=>i.decode())).then(()=>{for(const e of entries)e.c.getContext('2d').drawImage(composeContour(...e.images,e.p),180,280,820,520,0,0,820,520);});
</script></html>
