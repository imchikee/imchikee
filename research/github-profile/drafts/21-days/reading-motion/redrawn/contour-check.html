<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>轮廓毛发 · 同姿态对照</title><style>*{box-sizing:border-box}body{background:#faf7ef;color:#493a30;font:16px/1.7 system-ui,sans-serif;margin:0}main{max-width:1200px;margin:auto;padding:24px}h1{font-size:24px;margin:0 0 12px}h2{font-size:19px;margin:24px 0 10px}.pair{display:grid;grid-template-columns:1fr 1fr;gap:20px}figure{margin:0;min-width:0}canvas{display:block;width:100%;height:auto;border-radius:8px}figcaption{padding:8px 0}select{font:inherit;color:inherit;background:transparent;border:1px solid #bbae99;border-radius:5px;padding:4px 8px}a{color:inherit}.note{color:#827567;font-size:14px}@media(max-width:650px){.pair{grid-template-columns:1fr}main{padding:18px 14px}}@media(prefers-color-scheme:dark){body{background:#171b20;color:#e9e1d4}.note{color:#b4aa9d}}</style><main><h1>完整轮廓毛发 · 修订对照</h1><p>本轮统一检查左脸、左耳、右耳和右脸。可切换姿态与查看部位，比较毛尖、圆弧和圆腮体积。</p><label>姿态 <select id="pose"><option value="0">正面原稿</option><option value="1">中间姿态</option><option value="2">低头姿态</option></select></label> <label>查看部位 <select id="region"><option value="ear-left">左耳</option><option value="ear-right">右耳</option><option value="cheek-right">右脸</option><option value="cheek-left">左脸</option></select></label><h2>局部放大</h2><div class="pair"><figure><canvas id="detail-before" width="270" height="240" aria-label="修订前轮廓"></canvas><figcaption>修订前</figcaption></figure><figure><canvas id="detail-after" width="270" height="240" aria-label="本次轮廓修订"></canvas><figcaption>本次局部修订</figcaption></figure></div><h2>同一姿态的整体头部</h2><div class="pair"><figure><canvas id="head-before" width="820" height="520" aria-label="修订前头部"></canvas><figcaption>修订前</figcaption></figure><figure><canvas id="head-after" width="820" height="520" aria-label="统一修订四段轮廓后的头部"></canvas><figcaption>本次局部修订</figcaption></figure></div><p class="note" id="state"></p><p><a href="../index.html">查看动作</a> · <a href="WHOLE-CONTOUR-PROMPTS.md">生成记录</a></p></main><script src="contour-data.js"></script><script>
const images=contourPatches.map(p=>[p.base,p.patch,p.headPatch].map(src=>{const i=new Image();i.src='../'+src;return i;}));
const regions={'ear-left':[300,340,270,230],'ear-right':[730,350,210,225],'cheek-right':[820,500,210,235],'cheek-left':[200,490,270,240]};
function show(){const n=Number(document.getElementById('pose').value),[before,patch,head]=images[n],after=composeContour(before,patch,head,contourPatches[n]);const box=regions[document.getElementById('region').value];for(const [name,image] of [['before',before],['after',after]]){const c=document.getElementById('detail-'+name);c.width=box[2];c.height=box[3];c.getContext('2d').drawImage(image,...box,0,0,box[2],box[3]);document.getElementById('head-'+name).getContext('2d').drawImage(image,180,280,820,520,0,0,820,520);}document.getElementById('state').textContent='当前：'+contourPatches[n].name+'。本轮覆盖左右脸及双耳，毛发尚未最终确认；动作过渡重影仍须处理。';}
window.contourReady=Promise.all(images.flat().map(i=>i.decode())).then(()=>{show();document.getElementById('pose').onchange=show;document.getElementById('region').onchange=show;}).catch(e=>{document.getElementById('state').textContent='图片加载失败';throw e;});
</script></html>
