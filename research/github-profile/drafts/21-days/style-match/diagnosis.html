<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>第一幕实际动作质感核对</title><style>body{margin:24px;background:#181d21;color:#eee8dc;font:16px/1.6 system-ui}h1{font-size:24px}.frames{display:grid;grid-template-columns:repeat(3,minmax(0,534px));gap:18px}figure{margin:0}img{display:block;width:100%;max-width:534px}figcaption{margin-top:10px}a{color:#b6d8cb}@media(max-width:900px){.frames{grid-template-columns:1fr}}</style><h1>第一幕：实际动画中的质感变化</h1><p>直接截取当前动画，未改原画或绘制代码。三个画面按相同尺寸展示。</p><div class="frames"><figure><img src="actual-front.png" alt="0秒抬头"><figcaption>0秒 · 抬头：面部笔触可辨，腮帮仍偏细密毛绒。</figcaption></figure><figure><img src="actual-transition.png" alt="0.45秒过渡"><figcaption>0.45秒 · 过渡：帽檐已有双边，脸部两套毛纹混合，笔触比静态时不稳定。</figcaption></figure><figure><img src="actual-down.png" alt="1.1秒低头"><figcaption>1.1秒 · 低头：直接使用低头原画，仍有细密、偏均匀的毛绒感；不全是过渡叠化导致。</figcaption></figure></div><p>存在两个问题：姿态原画之间笔触不一致；过渡叠化又削弱稳定的笔触。后者属于此前暂时搁置的动作融合问题，本次仅核对，没有擅自重开修补。</p><p>上色改进应先针对实际采用的中间/低头原画，并与正面及场景共同核对；修改单张正面原画不足以改善整段。<a href="../reading-motion/index.html">查看当前动作</a></p></html>
