<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>低头笔触 · 同步动作对照</title><style>body{margin:24px;background:#181d21;color:#eee8dc;font:16px/1.6 system-ui}h1{font-size:24px}.pair{display:grid;grid-template-columns:repeat(2,minmax(0,534px));gap:24px}figure{margin:0}canvas{width:100%;display:block}figcaption{margin-top:10px}.controls{display:flex;align-items:center;gap:16px;max-width:1092px;margin:20px 0}input{flex:1;min-width:40px}button{font:inherit;padding:5px 12px}a{color:#b6d8cb}@media(max-width:700px){.pair{grid-template-columns:1fr}}</style><h1>低头笔触 · 同步动作对照</h1><p>右侧仅替换低头原画的候选，保留当前轮廓补片和动作方法；正面、中间姿态均未修改。默认停在低头位置。</p><div class="pair"><figure><canvas id="original" aria-label="原版动作"></canvas><figcaption>原版</figcaption></figure><figure><canvas id="candidate" aria-label="低头原画笔触候选动作"></canvas><figcaption>候选：低头脸颊改用较宽的顺向笔触，仍须判断是否显硬。</figcaption></figure></div><div class="controls"><button id="play">播放</button><button id="replay">重播</button><input id="seek" aria-label="同步动作进度" type="range" min="0" max="3.2" step="0.01" value="1.1"><output id="time">1.10 s</output></div><p id="status">正在加载…</p><p>这是独立试验页，未替换主页。<a href="down-painted-v1.png">生成原画</a> · <a href="DOWN-PROMPT.md">提示词与说明</a></p>
<script src="../reading-motion/redrawn/contour-data.js"></script><script src="../reading-shot.js"></script><script src="down-study.js"></script><script>
const before=createReadingShot(document.getElementById('original'),'../reading-motion/'),after=createDownPaintStudy(document.getElementById('candidate'),'../reading-motion/');
const seek=document.getElementById('seek'),play=document.getElementById('play'),time=document.getElementById('time');let elapsed=1.1,playing=false,last=null,loaded=false;
function draw(){if(!loaded)return;before.draw(elapsed);after.draw(elapsed);seek.value=elapsed;time.value=elapsed.toFixed(2)+' s';play.textContent=playing?'暂停':'播放';}
play.onclick=()=>{if(!loaded)return;if(elapsed>=3.2)elapsed=0;playing=!playing;last=null;draw();};document.getElementById('replay').onclick=()=>{if(!loaded)return;elapsed=0;playing=true;last=null;draw();};seek.oninput=()=>{elapsed=+seek.value;playing=false;last=null;draw();};
document.addEventListener('visibilitychange',()=>last=null);const reduced=matchMedia('(prefers-reduced-motion: reduce)');reduced.addEventListener('change',()=>{if(reduced.matches){playing=false;draw();}});
Promise.all([before.ready,after.ready]).then(()=>{loaded=true;draw();document.getElementById('status').textContent='两侧由同一时钟控制；尚未统一中间姿态，不能视为整段定稿。';}).catch(()=>document.getElementById('status').textContent='原画加载失败。');
requestAnimationFrame(function tick(now){if(loaded&&playing&&!document.hidden){if(last!==null)elapsed=Math.min(3.2,elapsed+(now-last)/1000);if(elapsed===3.2)playing=false;draw();}last=now;requestAnimationFrame(tick);});
</script></html>
