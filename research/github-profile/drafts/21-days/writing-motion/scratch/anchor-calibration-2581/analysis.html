<!doctype html><meta charset="utf-8"><main>Anchor calibration only</main><script>
window.done=(async()=>{
 const load=async src=>{const i=new Image();i.src=src;await i.decode();return i;};
 const [raw,frame,clean]=await Promise.all([load('source-static-v33.png'),load('../joint-structure-2581/baseline.png'),load('../joint-structure-2581/clean-base.png')]);
 const registered=document.createElement('canvas');registered.width=1316;registered.height=1195;registered.getContext('2d').drawImage(raw,5,4);
 const delta={x:-24.299984795095952,y:-2.9123116536784437};
 const rows=[{name:'Previous S/W',S:{x:400,y:850},W:{x:506,y:860}},{name:'H1: shallow hidden shoulder',S:{x:410,y:805},W:{x:496,y:858}},{name:'H2: deeper hidden shoulder',S:{x:435,y:795},W:{x:501,y:870}}].map(r=>{const W0={x:r.W.x-delta.x,y:r.W.y-delta.y},d0=Math.hypot(W0.x-r.S.x,W0.y-r.S.y),dt=Math.hypot(r.W.x-r.S.x,r.W.y-r.S.y);return {...r,W0,d0,dt,reduction:d0-dt,reductionPercent:100*(d0-dt)/d0};});
 const c=document.createElement('canvas');c.width=1860;c.height=1220;const x=c.getContext('2d');x.fillStyle='#181d21';x.fillRect(0,0,c.width,c.height);x.fillStyle='#eee8dc';x.font='24px sans-serif';x.fillText('Anchor calibration — right pose at 2.581 s; regions and hypotheses, NOT confirmed joints',16,34);
 const region=(pts,color)=>{x.beginPath();pts.forEach(([a,b],i)=>x[i?'lineTo':'moveTo'](a,b));x.closePath();x.fillStyle=color+'44';x.fill();x.strokeStyle=color;x.lineWidth=1;x.stroke();};
 const mark=(p,label,color)=>{x.strokeStyle=color;x.fillStyle=color;x.lineWidth=1;x.beginPath();x.arc(p.x,p.y,3,0,7);x.stroke();x.font='8px sans-serif';x.fillText(label,p.x+5,p.y-5);};
 function panel(im,px,py,title,mode){
  x.fillStyle='#eee8dc';x.font='20px sans-serif';x.fillText(title,px,py-12);
  x.save();x.beginPath();x.rect(px,py,600,440);x.clip();x.translate(px,py);x.scale(2,2);x.translate(-330,-730);x.drawImage(im,0,0);
  if(mode==='regions'){
   region([[378,811],[405,805],[434,818],[420,849],[380,857]],'#40dbe0');
   region([[386,778],[438,780],[454,808],[430,822],[396,806]],'#83e28d');
   region([[487,843],[507,836],[516,850],[512,877],[494,882],[485,867]].map(([a,b])=>im===registered?[a-delta.x,b-delta.y]:[a,b]),'#f38ac5');
   mark({x:400,y:850},'S old','#ffffff');mark(im===registered?rows[0].W0:rows[0].W,im===registered?'W0 inferred':'W old','#ffffff');
   mark(im===registered?{x:515,y:858}:{x:490.700015,y:855.087688},'split (code)','#faca53');
  }else if(mode){
   const r=rows[mode];region([[386,778],[438,780],[454,808],[430,822],[396,806]],'#83e28d');region([[487,843],[507,836],[516,850],[512,877],[494,882],[485,867]],'#f38ac5');
   x.strokeStyle='#faca53';x.lineWidth=1;x.setLineDash([3,2]);x.beginPath();x.moveTo(r.S.x,r.S.y);x.lineTo(r.W.x,r.W.y);x.stroke();x.setLineDash([]);
   mark(r.S,'S hypothesis','#faca53');mark(r.W,'W hypothesis','#faca53');mark(rows[0].S,'S old','#fff');mark(rows[0].W,'W old','#fff');
  }
  x.restore();
 }
 panel(registered,15,80,'Original v33 (registered +5,+4); no motion','regions');
 panel(frame,630,80,'Actual right frame — 2.581 s','regions');
 panel(clean,1245,80,'Existing clean-base (generated repair, not anatomy)','regions');
 panel(frame,15,610,'H1: S(410,805), W(496,858)',1);
 panel(frame,630,610,'H2: S(435,795), W(501,870)',2);
 x.fillStyle='#eee8dc';x.font='18px sans-serif';let y=610;
 const lines=['Region key (scene coordinates):','CYAN: visible body/limb contact band','GREEN: possible cheek-hidden root','PINK: possible wrist / paw overlap','WHITE: previous experiment anchors','YELLOW split: current code layer boundary','','Distance comparison (pixels):',...rows.flatMap(r=>[r.name,`static ${r.d0.toFixed(2)} -> pose ${r.dt.toFixed(2)}`,`loss ${r.reduction.toFixed(2)} (${r.reductionPercent.toFixed(2)}%)`]),'','Dotted S-W = distance only, NOT a bone','No new limb, elbow or texture generated.'];
 for(const line of lines){x.fillText(line,1245,y);y+=24;}
 x.font='18px sans-serif';x.fillText('Regions are hand-estimated from fur overlap; hidden shoulder and wrist centers cannot be recovered uniquely from these images.',16,1110);
 x.fillText('Static wrist inferred by reversing the actual grip translation, not by asserting equal bone length or diagnosing 3D compression.',16,1142);
 x.fillText('Clean-base is a layer-repair reference. It does not independently verify a shoulder joint or hidden upper-arm structure.',16,1174);
 window.output=c;window.numbers={delta,rows,sourceRegistration:{x:5,y:4},codeSplitSource:{x:515,y:858},codeSplitAtPose:{x:515+delta.x,y:858+delta.y}};return true;
})();</script>
