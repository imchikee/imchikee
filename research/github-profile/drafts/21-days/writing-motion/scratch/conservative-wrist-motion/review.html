<!doctype html><meta charset="utf-8"><main>Existing-output comparison compositor</main><script>
window.reviewReady=(async()=>{window.outputs={};const load=async src=>{const i=new Image();i.src=src;await i.decode();return i;};for(const t of [0,2.581,3.8]){const c=document.createElement('canvas');c.width=1320;c.height=540;const x=c.getContext('2d');x.fillStyle='#181d21';x.fillRect(0,0,1320,540);for(const [i,name] of ['baseline','candidate'].entries()){x.fillStyle='#eee8dc';x.font='20px sans-serif';x.fillText((i?'Candidate - ':'70% baseline - ')+t+' s',i*660+8,28);x.drawImage(await load(name+'-'+t+'.png'),320,730,330,250,i*660,40,660,500);}outputs['comparison-'+t+'.png']=c;}return true;})();</script>
