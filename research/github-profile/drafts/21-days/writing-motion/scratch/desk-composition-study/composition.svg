    <text x="574" y="70" font-size="18">01 头部与肩线</text>
    <text x="574" y="96" font-size="14">前俯为主，微向画面左转。</text>
    <text x="574" y="119" font-size="14">重画帽檐、眼窝、鼻口与腮肩遮挡。</text>
    <text x="574" y="159" font-size="18">02 纸面与握笔链</text>
    <text x="574" y="185" font-size="14">字行靠近胸前，笔记本仍平放。</text>
    <text x="574" y="208" font-size="14">重画书脊、页缘、前臂、爪与笔的投影。</text>
    <text x="574" y="248" font-size="18">03 观察角度与环境</text>
    <text x="574" y="274" font-size="14">机位向画面右侧让开，并略微抬高。</text>
    <text x="574" y="297" font-size="14">重画桌面透视及受影响的近景物件。</text>
    <text x="574" y="337" font-size="16">俯视示意 · 同一构图</text>
    <text x="683" y="477" font-size="14">机位</text>
    <text x="592" y="432" font-size="13">字行</text>
    <text x="705" y="401" font-size="13">胸前</text>
    <text x="20" y="539" font-size="13">青色虚线表示双眼注视方向。标注圈表示后续需要重新绘制或重新投影的范围。</text>
  </g>
