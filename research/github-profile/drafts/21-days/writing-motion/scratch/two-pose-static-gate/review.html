<!doctype html><meta charset="utf-8"><main>Static source qualification review only</main><script>
window.reviewReady=(async()=>{window.outputs={};const load=async file=>{const im=new Image();im.src=file;await im.decode();return im;};const [a,b,ref]=await Promise.all(['pose-a.png','pose-b.png','current-reference.png'].map(load));
const c=document.createElement('canvas');c.width=1320;c.height=1520;const x=c.getContext('2d');x.fillStyle='#181d21';x.fillRect(0,0,c.width,c.height);const label=(s,px,py)=>{x.fillStyle='#eee8dc';x.font='19px sans-serif';x.fillText(s,px+8,py+28);};
for(const [i,im] of [a,b].entries()){const px=i*660;label(i?'Pose B: archived contact drawing (NOT newly made)':'Pose A: archived contact drawing (NOT newly made)',px,0);x.drawImage(im,px,40,660,600);label('Same-coordinate shoulder / arm / grip - 200%',px,650);x.drawImage(im,320,730,330,250,px,690,660,500);}
label('Locked page content: CURRENT reference / A / B (same coordinates, no fitting)',0,1200);for(const [i,im] of [ref,a,b].entries()){const px=i*440;label(['CURRENT 70% reference','Pose A source','Pose B source'][i],px,1240);x.drawImage(im,375,845,620,250,px,1280,440,177.42);}label('STATIC GATE FAILED - no interpolation / transition performed',0,1470);outputs['pose-review.png']=c;return true;})();</script>
