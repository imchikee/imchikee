<!doctype html><meta charset="utf-8"><main>New Pose A - full connected action integration review</main><script>
window.reviewReady=(async()=>{const load=async src=>{const im=new Image();im.src=src;await im.decode();return im;};const [base,raw]=await Promise.all(['current-start.png','pose-a-raw.png'].map(load));if(base.naturalWidth!==raw.naturalWidth||base.naturalHeight!==raw.naturalHeight)throw Error('Registration mismatch: no automatic fitting allowed');const make=(w=1316,h=1195)=>{const c=document.createElement('canvas');c.width=w;c.height=h;return c;};
const candidate=make(),x=candidate.getContext('2d');x.drawImage(base,0,0);

// pencil, and the old pencil's swept source area. No feather, alpha extraction,
// armPath, per-edge clean-up or protected-page patch is applied.
const region=[330,750,310,170];x.drawImage(raw,...region,...region);window.outputs={'pose-a-candidate.png':candidate};
const full=make(2652,1245),f=full.getContext('2d');f.fillStyle='#181d21';f.fillRect(0,0,2652,1245);for(const [i,im] of [base,candidate].entries()){f.font='20px sans-serif';f.fillStyle='#eee8dc';f.fillText(i?'NEW Pose A integrated candidate - review only':'CURRENT starting frame',i*1336+8,28);f.drawImage(im,i*1336,50);}outputs['comparison-full.png']=full;
const detail=make(2020,540),q=detail.getContext('2d');q.fillStyle='#181d21';q.fillRect(0,0,2020,540);for(const [i,im] of [base,raw,candidate].entries()){q.font='20px sans-serif';q.fillStyle='#eee8dc';q.fillText(['Current start','NEW raw generated Pose A','NEW pose in current scene'][i],i*680+8,28);q.drawImage(im,320,730,330,250,i*680,40,660,500);}outputs['pose-review.png']=detail;
const locked=make(1980,1000),g=locked.getContext('2d');g.fillStyle='#181d21';g.fillRect(0,0,1980,1000);for(const [i,im] of [base,raw,candidate].entries()){const px=i*660;g.fillStyle='#eee8dc';g.font='19px sans-serif';g.fillText(['CURRENT face / page','RAW face / page','CANDIDATE face / page'][i],px+8,28);g.drawImage(im,535,635,330,190,px,40,660,380);g.drawImage(im,520,880,170,65,px,460,660,252.35);g.drawImage(im,1050,950,250,170,px,740,660,224.4);}outputs['locked-content-review.png']=locked;
const b=make(),r=make();b.getContext('2d').drawImage(base,0,0);r.getContext('2d').drawImage(raw,0,0);const before=b.getContext('2d').getImageData(0,0,1316,1195).data,generated=r.getContext('2d').getImageData(0,0,1316,1195).data,after=x.getImageData(0,0,1316,1195).data;
const rects={face:[535,635,330,190],pageWriting:[550,900,130,35],rightPage:[750,865,190,50],background:[1010,300,250,400]};const stats={};for(const [name,[ox,oy,w,h]] of Object.entries(rects)){let rawCount=0,candidateCount=0;for(let y=oy;y<oy+h;y++)for(let a=ox;a<ox+w;a++){const i=(y*1316+a)*4;if(before[i]!==generated[i]||before[i+1]!==generated[i+1]||before[i+2]!==generated[i+2])rawCount++;if(before[i]!==after[i]||before[i+1]!==after[i+1]||before[i+2]!==after[i+2])candidateCount++;}stats[name]={pixels:w*h,rawChanged:rawCount,candidateChanged:candidateCount};}
let outside=0;for(let y=0;y<1195;y++)for(let a=0;a<1316;a++){const i=(y*1316+a)*4;if((a<330||a>=640||y<750||y>=920)&&(before[i]!==after[i]||before[i+1]!==after[i+1]||before[i+2]!==after[i+2]))outside++;}
window.checks={inputDimensions:[1316,1195],generatedDimensions:[raw.naturalWidth,raw.naturalHeight],newGeneratedPose:true,imagegenCalls:1,actionRegion:region,oldArmPathUsed:false,featherUsed:false,generatedPixelsUnwarped:true,changedOutsideActionRegion:outside,protectedRegionStats:stats,stage:'Pose A only; visual verdict in REPORT.md'};return true;})();</script>
