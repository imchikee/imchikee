<!doctype html><meta charset="utf-8"><main>Raw painted pose review — no compositing</main><script>
window.done=(async()=>{const sources=['../joint-structure-2581/baseline.png','pose-a-raw.png','pose-b-raw.png'];const images=await Promise.all(sources.map(async src=>{const i=new Image();i.src=src;await i.decode();return i;}));const labels=['Right baseline 2.581s','A: minimal reset (raw)','B: overlap priority (raw)'];window.outputs={};const out=document.createElement('canvas');out.width=2020;out.height=490;const x=out.getContext('2d');x.fillStyle='#181d21';x.fillRect(0,0,2020,490);images.forEach((im,i)=>{const c=document.createElement('canvas');c.width=660;c.height=440;c.getContext('2d').drawImage(im,330,750,330,220,0,0,660,440);outputs[(i?'candidate-'+i:'baseline')+'-detail-200.png']=c;x.fillStyle='#eee8dc';x.font='20px sans-serif';x.fillText(labels[i],i*680+8,28);x.drawImage(c,i*680,50);});outputs['pose-review-200.png']=out;return true;})();</script>
