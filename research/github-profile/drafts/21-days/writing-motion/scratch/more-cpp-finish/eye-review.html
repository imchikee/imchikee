<!doctype html><meta charset="utf-8"><main><iframe id="old" src="../more-cpp-blink/index.html"></iframe><iframe id="new" src="index.html"></iframe></main><script>window.eyeReviewReady=(async()=>{const ws=['old','new'].map(id=>document.getElementById(id).contentWindow);for(let i=0;i<200;i++){if(ws.every(w=>w.moreCpp))break;await new Promise(r=>setTimeout(r,25));}await Promise.all(ws.map(w=>w.moreCpp.readyPromise));const c=document.createElement('canvas');c.width=1600;c.height=1040;const x=c.getContext('2d');x.fillStyle='#181d21';x.fillRect(0,0,1600,1040);const times=[1.5,1.533333,1.566667,1.6,1.633333,1.666667,1.7,1.766667];for(const [j,t] of times.entries())for(const [i,w] of ws.entries()){w.moreCpp.draw(t);const a=j%4*400,b=Math.floor(j/4)*520+i*260;x.fillStyle='#eee8dc';x.font='18px sans-serif';x.fillText((i?'AFTER ':'BEFORE ')+t.toFixed(3)+'s',a+8,b+25);x.drawImage(w.moreCpp.canvas,535,630,300,150,a,b+40,400,200);}window.eyeReview=c;return true;})();</script>
