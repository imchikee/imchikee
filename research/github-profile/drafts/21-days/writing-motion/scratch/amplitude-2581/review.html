<!doctype html><meta charset="utf-8"><main>Amplitude visual comparison</main><script>
window.done=(async()=>{const load=async src=>{const i=new Image();i.src=src;await i.decode();return i;};window.outputs={};for(const t of [2.581,3.8]){const c=document.createElement('canvas');c.width=2020;c.height=490;const x=c.getContext('2d');x.fillStyle='#181d21';x.fillRect(0,0,c.width,c.height);for(const [i,s] of [1,.7,.5].entries()){const im=await load('frame-'+s+'-'+t+'.png');x.fillStyle='#eee8dc';x.font='20px sans-serif';x.fillText((i?'Candidate '+(i===1?'A: 70%':'B: 50%'):'Original right: 100%')+' — '+t+'s',i*680+8,28);x.drawImage(im,330,750,330,220,i*680,50,660,440);}outputs['comparison-'+t+'.png']=c;}const c=document.createElement('canvas');c.width=2180;c.height=410;const x=c.getContext('2d');x.fillStyle='#181d21';x.fillRect(0,0,c.width,c.height);for(const [i,s] of [1,.7,.5].entries()){x.fillStyle='#eee8dc';x.font='20px sans-serif';x.fillText(s*100+'% isolated new ink — rotated to reader',i*730+8,28);x.drawImage(await load('ink-'+s+'.png'),i*730,50);}outputs['ink-review.png']=c;return true;})();</script>
