<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>第二幕 · 继续学C++</title><style>body{margin:24px;background:#181d21;color:#eee8dc;font:16px/1.6 system-ui}main{max-width:1100px;margin:auto}h1{font-size:24px}.pair{display:grid;grid-template-columns:1fr 1fr;gap:24px}figure{margin:0}canvas,img{display:block;width:100%;border-radius:8px}figcaption{margin-top:12px}.controls{display:flex;gap:12px;align-items:center;margin-top:20px}input{flex:1;min-width:30px}button{font:inherit;padding:5px 12px}a{color:#b6d8cb}@media(max-width:700px){.pair{grid-template-columns:1fr}}</style><main><h1>第二幕 · Days 11–21：More C++</h1><p>当前候选：保留原脸型，轻调脸颊受光；字迹随纸页透视，短腕转动书写。</p><div class="pair"><figure><canvas id="stage" aria-label="仓鼠伏案写C++笔记"></canvas><figcaption>第二幕 · 逐笔写出整行代码</figcaption></figure><figure><img src="../reading-motion/lighting/down-v2.png" alt="第一幕已确认的角色与画风参考"><figcaption>第一幕 · 只对照角色与画风</figcaption></figure></div><div class="controls"><button id="play">播放</button><button id="replay">重播</button><input id="seek" type="range" min="0" max="3.2" step="0.01" value="0" aria-label="动作进度"><output id="time">0.00 s</output></div><p id="status">正在加载…</p><p><a href="character-comparison.png">两幕角色与场景对照</a> · <a href="whole-animation.png">完整动作连续帧</a> · <a href="face-phases-current-1.png">原尺寸面部阶段一</a> · <a href="face-phases-current-2.png">原尺寸面部阶段二</a> · <a href="ink-comparison.png">起笔 / 写完</a> · <a href="writer-view.png">仓鼠阅读方向</a> · <a href="../index.html">完整主页</a> · <a href="README.md">历史试稿记录</a> · <a href="PAGE-PLANE-WRIST.md">素材与内置提示词</a></p><details><summary>脸宽核对：同尺寸、眼睛高度</summary><p>两图均为1316×1195，眼睛对齐后，在共同可见的眼睛高度估量脸部外沿，两幕均约710像素（毛边约±10像素）。这不是完整下半脸最宽处的测量，不能据此排除下半脸比例偏宽。第一幕下半脸被书遮挡，不能把可见宽度直接当作完整腮帮宽度。</p><img src="face-width-check.png" alt="上第一幕、下第二幕，同眼睛高度对照脸部外沿"></details></main><script src="shot.js?revision=25"></script><script>
const shot=createWritingShot(document.getElementById('stage'),'');const seek=document.getElementById('seek'),play=document.getElementById('play'),out=document.getElementById('time');const reduced=matchMedia('(prefers-reduced-motion: reduce)');let elapsed=0,playing=!reduced.matches,last=null,loaded=false;
function draw(){shot.draw(elapsed);seek.value=elapsed;out.value=elapsed.toFixed(2)+' s';play.textContent=playing?'暂停':'播放';}
play.onclick=()=>{if(elapsed>=3.2)elapsed=0;playing=!playing;last=null;draw();};document.getElementById('replay').onclick=()=>{elapsed=0;playing=true;last=null;draw();};seek.oninput=()=>{elapsed=+seek.value;playing=false;last=null;draw();};document.addEventListener('visibilitychange',()=>last=null);reduced.addEventListener('change',()=>{if(reduced.matches){playing=false;draw();}});
shot.ready.then(()=>{loaded=true;draw();document.getElementById('status').textContent='字迹跟随各自纸页的倾斜与透视；短前爪通过手腕转动书写。';}).catch(()=>document.getElementById('status').textContent='原画加载失败。');requestAnimationFrame(function tick(now){if(loaded&&playing&&!document.hidden){if(last!==null)elapsed=Math.min(3.2,elapsed+(now-last)/1000);if(elapsed===3.2)playing=false;draw();}last=now;requestAnimationFrame(tick);});
</script></html>
